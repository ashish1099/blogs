  <rect x="560" y="612" width="292" height="62" rx="9" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="574" y="638" font-size="13.5" fill="#713f12">Fix 1: Mattermost never asks for openid;</text>
  <text x="574" y="657" font-size="13.5" fill="#713f12">the default scope adds it anyway.</text>

  <rect x="868" y="612" width="292" height="62" rx="9" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="882" y="638" font-size="13.5" fill="#713f12">Fix 2: id claim must be JSON long;</text>
  <text x="882" y="657" font-size="13.5" fill="#713f12">mappers set on /userinfo.</text>
