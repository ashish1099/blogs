<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">On-call paging: the alert router bridges GoAlert and ntfy, ack = chat emoji</text>

  <!-- alertmanagers -->
  <rect x="60" y="64" width="230" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="175" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Alertmanager</text>
  <text x="175" y="107" text-anchor="middle" font-size="13" fill="#475569">customer 1</text>
  <rect x="330" y="64" width="230" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="445" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Alertmanager</text>
  <text x="445" y="107" text-anchor="middle" font-size="13" fill="#475569">customer 2</text>

  <!-- alert router -->
  <rect x="190" y="180" width="250" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="315" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Alert router</text>
  <text x="315" y="226" text-anchor="middle" font-size="13" fill="#475569">ingest + group alerts</text>

  <!-- mattermost -->
  <rect x="880" y="180" width="260" height="62" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1010" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Mattermost</text>
  <text x="1010" y="226" text-anchor="middle" font-size="13" fill="#475569">one thread per alert-group</text>

  <!-- goalert -->
  <rect x="190" y="330" width="250" height="62" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="315" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">GoAlert</text>
  <text x="315" y="376" text-anchor="middle" font-size="13" fill="#475569">schedules + escalation timers</text>

  <!-- ntfy server -->
  <rect x="190" y="470" width="250" height="62" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="315" y="496" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">ntfy server</text>
  <text x="315" y="516" text-anchor="middle" font-size="13" fill="#475569">self-hosted, topic oncall-&lt;user&gt;</text>

  <!-- on-call phone -->
  <rect x="190" y="610" width="250" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="315" y="636" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">On-call SRE's ntfy app</text>
  <text x="315" y="656" text-anchor="middle" font-size="13" fill="#475569">priority-5 push</text>

  <!-- ack diamond -->
  <polygon points="640,596 718,641 640,686 562,641" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="640" y="647" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">ack?</text>

  <!-- second escalation -->
  <rect x="500" y="720" width="300" height="62" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="650" y="746" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Second escalation: senior / management</text>
  <text x="650" y="766" text-anchor="middle" font-size="13" fill="#475569">ntfy + SMS pointer</text>

  <!-- step 1: alertmanagers -> router -->
  <path d="M175,120 L255,178" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M445,120 L375,178" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="188" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">step 1</text>
  <text x="442" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">step 1</text>

  <!-- router -> mattermost -->
  <path d="M440,211 L878,211" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="659" y="200" text-anchor="middle" font-size="13" fill="#475569">one chat thread per alert-group</text>

  <!-- step 2: router -> goalert -->
  <path d="M315,242 L315,328" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="335" y="280" text-anchor="start" font-size="13" font-weight="700" fill="#dc2626">step 2</text>
  <text x="335" y="298" text-anchor="start" font-size="13" fill="#475569">alert payload + chat thread link</text>

  <!-- step 3: goalert -> ntfy -->
  <path d="M315,392 L315,468" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="335" y="420" text-anchor="start" font-size="13" font-weight="700" fill="#dc2626">step 3</text>
  <text x="335" y="438" text-anchor="start" font-size="13" fill="#475569">first escalation: page with chat link</text>

  <!-- step 4: ntfy -> phone -->
  <path d="M315,532 L315,608" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="335" y="560" text-anchor="start" font-size="13" font-weight="700" fill="#dc2626">step 4</text>
  <text x="335" y="578" text-anchor="start" font-size="13" fill="#475569">click = thread permalink</text>

  <!-- phone -> ack? -->
  <path d="M440,641 L558,641" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- step 5A yes: ack? -> mattermost -->
  <path d="M718,641 L1010,641 L1010,246" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="737" y="630" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">yes</text>
  <text x="1024" y="450" text-anchor="start" font-size="13" font-weight="700" fill="#dc2626">step 5(A)</text>
  <text x="1024" y="470" text-anchor="start" font-size="13" fill="#475569">opens chat link,</text>
  <text x="1024" y="488" text-anchor="start" font-size="13" fill="#475569">adds emoji reaction</text>

  <!-- step 5B no: ack? -> second escalation -->
  <path d="M640,688 L648,718" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="622" y="708" text-anchor="end" font-size="13" font-weight="700" fill="#ef4444">no</text>
  <text x="668" y="708" text-anchor="start" font-size="13" font-weight="700" fill="#dc2626">step 5(B)</text>

  <!-- step 6: mattermost -> router (poll arc) -->
  <path d="M1010,178 C 900,88 560,88 444,176" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="722" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">step 6</text>
  <text x="722" y="118" text-anchor="middle" font-size="13" fill="#475569">alert router polls the thread for the ack (every 30s)</text>

  <!-- step 7: router -> goalert (ack) -->
  <path d="M188,225 C 110,255 110,325 186,355" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="92" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">step 7</text>
  <text x="92" y="290" text-anchor="middle" font-size="13" fill="#475569">ack the alert</text>
  <text x="92" y="308" text-anchor="middle" font-size="13" fill="#475569">(updateAlerts)</text>
</svg>
